---
# Main quality gate. Bazel pins every tool and owns every gate: the
# hermetic checks are cached `bazel test` targets, so `bazel test //...`
# runs them all, and the few that need the network, Git history or the
# GitHub API run as their own steps after it. A final `conclusion` job gives
# branch protection one stable required check.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Bazel 9.x only, the version .bazelversion pins, on Linux (x86_64 and
  # arm64), macOS (arm64) and Windows (x86_64). The checks that need the
  # network or GitHub's API run on Linux only; they do not depend on the OS.
  bazel:
    name: "bazel (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025]
        include:
          - os: ubuntu-26.04
            release: release
          - os: ubuntu-26.04-arm
            release: release
          - os: macos-26
            release: release
          # Bazel runs the workspace status command without a shell on
          # Windows, so the release config there uses the batch script.
          - os: windows-2025
            release: release-windows
    defaults:
      run:
        shell: bash
    steps:
      # Full history: the release build stamps the version through
      # `git describe`.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # rules' shared setup: runner hardening (Linux), Bazel and its caches,
      # the Windows and Linux arm64 fixes, and a fetch that retries
      # transient failures. See its .github/actions/README.md.
      - name: Set up Bazel for CI
        uses: tbhb-dev/rules/.github/actions/setup-bazel-ci@b3262bfff7711c7327a240592d9b9345a800584a  # main
        with:
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          cache-save: ${{ github.event_name != 'pull_request' }}

      # //... is every hermetic gate: the whole-tree lint tests (secrets in
      # the working tree, YAML, TOML, Markdown, prose, EditorConfig,
      # workflows, shell, CODEOWNERS paths), the format check, Starlark
      # lint, nogo during the build, the Go tests and linters,
      # the coverage checks, the docs bundle and REUSE checks, the import
      # contracts, and the preset staleness test.
      - name: Test
        run: bazelisk test --config=ci //...

      - name: Build the release binary
        env:
          RELEASE_CONFIG: ${{ matrix.release }}
        run: bazelisk build "--config=${RELEASE_CONFIG}" //cmd/ascm

      # A failed run's test logs, so a failure that does not recur can still
      # be read.
      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: testlogs-${{ matrix.os }}
          path: |
            .bazel-testlogs/**/test.log
            .bazel-testlogs/**/test.xml
          # The convenience links are dotfiles, which the action skips by default.
          include-hidden-files: true
          if-no-files-found: ignore

  # The repository-level checks that need Git history, the network or the
  # GitHub API, in rules' shared workflow, on Linux beside the bazel matrix so
  # they don't wait behind the tests. A job that calls a workflow can't set
  # its own timeout, so it is an input.
  repo:
    name: repo
    permissions:
      contents: read
    uses: tbhb-dev/rules/.github/workflows/repo-checks.yml@b3262bfff7711c7327a240592d9b9345a800584a  # main
    with:
      timeout-minutes: 10
      gazelle-dirs: .
      module-dirs: .
      pip-audit-target: ""
      govulncheck-target: //:govulncheck

  # One stable required check for branch protection. `if: always()` runs it
  # even when a needed job failed. rules' ci-conclusion passes only when
  # every needed job's result is exactly "success", so a gate that was
  # skipped, cancelled or never finished cannot pass. It stays a local job:
  # a job that calls a workflow reports a different check name.
  conclusion:
    name: conclusion
    if: always()
    needs: [bazel, repo]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job did not succeed
        uses: tbhb-dev/rules/.github/actions/ci-conclusion@b3262bfff7711c7327a240592d9b9345a800584a  # main
        with:
          needs: ${{ toJSON(needs) }}
